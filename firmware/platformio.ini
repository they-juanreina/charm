; Charm · firmware propio para Heltec Vision Master E213 (ESP32-S3 + e-ink 250x122)
[platformio]
default_envs = charm-dev

[env]
platform = espressif32
board = heltec_vision_master_e213
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
  -Wall
  -DCHARM_FW_VERSION=\"0.1.0\"
lib_deps =
  https://github.com/meshtastic/GxEPD2/archive/c7eb4c3c167cf396ef4f541cc5d4c6aa42f3c46b.zip
  https://github.com/adafruit/Adafruit-GFX-Library/archive/refs/tags/1.12.6.zip
  https://github.com/adafruit/Adafruit_BusIO/archive/refs/tags/1.17.4.zip
  ricmoo/QRCode@0.0.1
extra_scripts = pre:tools/embed_web.py

; Producción: deep sleep entre pulsaciones
[env:charm]
build_flags = ${env.build_flags} -DCORE_DEBUG_LEVEL=1

; Desarrollo: sin deep sleep (el USB no desaparece) y logs verbosos
[env:charm-dev]
build_flags = ${env.build_flags} -DCHARM_NO_SLEEP -DCORE_DEBUG_LEVEL=3
